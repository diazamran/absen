# PresensiKu — Nginx Reverse Proxy (No Docker)
# Copy to: /etc/nginx/sites-available/presensiku
# Enable:  sudo ln -sf /etc/nginx/sites-available/presensiku /etc/nginx/sites-enabled/
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx

# Upstream: Node.js backend on port 4000
upstream presensiku_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Ganti dengan domain jika pakai domain

    # Frontend static files
    root /opt/presensiku/apps/web/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # Static assets cache (Vite generates hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://presensiku_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        # Large file uploads (face photos, imports)
        client_max_body_size 50M;
    }

    # Socket.IO / WebSocket
    location /socket.io/ {
        proxy_pass http://presensiku_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads (face photos, QR cards, etc.)
    location /uploads/ {
        alias /opt/presensiku/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
